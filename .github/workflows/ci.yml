name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fetch-luts
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: research/uv.lock
      - name: Install
        working-directory: research
        run: uv sync --locked
      - name: Lint
        run: make lint-py
      - name: Test
        run: make test-py

  swift-package:
    name: swift-package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Lint
        run: make lint-swift
      - name: Test
        run: make test-swift

  ios-app:
    name: ios-app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fetch-luts
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Generate project
        run: make xcode
      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmSim.xcodeproj \
            -scheme FilmSim \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
      - name: Check LUTs are bundled
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'FilmSim.app' -path '*Debug-iphonesimulator*' | head -n1)
          test -n "$app" && ls "$app"/*.cube
      # The configuration archived for the App Store. Its build fails if a Fujifilm LUT got in (ADR 0010).
      - name: Build (simulator, unsigned, Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmSim.xcodeproj \
            -scheme FilmSim \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
      - name: Check the Release build has only its own LUTs
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'FilmSim.app' -path '*Release-iphonesimulator*' | head -n1)
          test -n "$app"
          test -f "$app/Portra400VC_65grid.cube"
          test -f "$app/PrivacyInfo.xcprivacy"
          if ls "$app" | grep -i '^FLog2_to_'; then
            echo "::error::Fujifilm LUTs are in the Release build (ADR 0010)"
            exit 1
          fi

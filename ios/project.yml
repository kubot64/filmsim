name: FilmSim
options:
  bundleIdPrefix: com.morikubo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FilmSimCore:
    path: FilmSimCore
targets:
  FilmSim:
    type: application
    platform: iOS
    sources:
      - path: FilmSim
        excludes:
          - BuildInfo.generated.swift
      # Written by the "Build info" script below on every build; gitignored.
      - path: FilmSim/BuildInfo.generated.swift
        optional: true
    preBuildScripts:
      # The commit the app was built from, shown in Settings and written into saved HEICs,
      # so a photo on the phone can be traced back to the code that developed it.
      - name: Build info
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/FilmSim/BuildInfo.generated.swift
        script: |
          out="$SRCROOT/FilmSim/BuildInfo.generated.swift"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          date=$(git -C "$SRCROOT" log -1 --format=%cd --date=format:%Y-%m-%d 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain --untracked-files=no 2>/dev/null)" ]; then dirty=true; else dirty=false; fi
          content="// Generated by the \"Build info\" script in project.yml. Do not edit.
          enum BuildInfo {
              static let commit = \"$commit\"
              static let commitDate = \"$date\"
              static let isDirty = $dirty
          }"
          # Rewrite only on change so an unchanged commit does not recompile the file.
          if [ "$(cat "$out" 2>/dev/null)" != "$content" ]; then printf '%s\n' "$content" > "$out"; fi
    postBuildScripts:
      # Fujifilm's LUTs may not be redistributed, so the Release build (the one archived for the
      # App Store) must not carry them (ADR 0010). EXCLUDED_SOURCE_FILE_NAMES below leaves them
      # out; this fails the build if one still got in.
      - name: No Fujifilm LUTs in Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            found=$(find "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" -maxdepth 1 -iname 'FLog2_to_*.cube')
            if [ -n "$found" ]; then
              echo "error: Fujifilm LUTs must not be in a Release build: $found"
              exit 1
            fi
          fi
    dependencies:
      - package: FilmSimCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Name under the home-screen icon. The target, module and repo stay FilmSim / filmsim.
        INFOPLIST_KEY_CFBundleDisplayName: Irocam
        # The App Store version. Raise CURRENT_PROJECT_VERSION for every upload, and
        # MARKETING_VERSION for every release (README "App Store に出す").
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # No encryption beyond what iOS itself provides, so no export compliance documents.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSCameraUsageDescription: "RAW 撮影のためにカメラを使います"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "現像した写真と DNG を保存します"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "このアプリで撮った写真を表示し、DNG を選んで現像し直します"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        # The build-info script reads git and writes a source file.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Core Image kernels written in Metal need these two flags.
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"
      configs:
        Release:
          # See "No Fujifilm LUTs in Release" above.
          EXCLUDED_SOURCE_FILE_NAMES: "FLog2_to_*.cube"

name: FilmSim
options:
  bundleIdPrefix: com.morikubo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FilmSimCore:
    path: FilmSimCore
targets:
  FilmSim:
    type: application
    platform: iOS
    sources:
      - path: FilmSim
    dependencies:
      - package: FilmSimCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "RAW 撮影のためにカメラを使います"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "現像した写真と DNG を保存します"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "DNG を選んで再現像します"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # Core Image kernels written in Metal need these two flags.
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-cikernel"

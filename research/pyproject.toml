[project]
name = "filmsim-research"
version = "0.1.0"
description = "Fujifilm film-simulation pipeline research: linear RAW -> F-Log2 -> official LUT, verified against OOC JPEGs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "rawpy>=0.21",
    "colour-science>=0.4.4",
    "pillow>=10",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
